  dashboard_permissions:
    description: Environment-specific permissions shared by all AI/BI dashboards.
    type: complex
  dashboard_warehouse_id:
    description: SQL warehouse used unless overridden on a dashboard resource.
    default: ${var.sql_warehouse_serverless_small_id}

targets:
  dev:
    variables:
      # name: dev_dashboard_permissions
      # description: Mapped dev permissions for AI/BI dashboards.
      # required: true
      # value:
      #   modes: ["infer", "input"]
      #   infer: From the mapping beside variables.dashboard_permissions in this file,
      #     selecting confirmed project.domain case-insensitively, then dev.
      #     Preserve the native permission list unless explicitly overridden.
      dashboard_permissions: "{{dev_dashboard_permissions}}"
  stg:
    variables:
      # name: stg_dashboard_permissions
