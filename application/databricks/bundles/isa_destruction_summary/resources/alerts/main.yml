# Paused authoring example; replace the query and condition for a real alert.
resources:
  alerts:
    ALERT_VIOLATION_COUNT:
      display_name: ${var.project.domain}-${var.project.dataset}-VIOLATION
      permissions: ${var.alert_permissions}
      run_as:
        service_principal_name: ${var.runas_service_account}
      warehouse_id: ${var.alert_warehouse_id}
      query_text: |
        SELECT 0 AS violation_count
      evaluation:
        comparison_operator: GREATER_THAN
        source:
          name: violation_count
        threshold:
          value:
            double_value: 0
        notification:
          subscriptions: ${var.alert_subscriptions}
      schedule:
        quartz_cron_schedule: '0 0 * * * ?'
        timezone_id: ${var.timezone}
        pause_status: PAUSED
