# --------------------------------------------------------------------------------------------------------------------
# To migrate this pipeline to another project/repo, in the variables section, update:
# 1. source_folder: update this if your Function App folder path is different.
# 2. dev_functionApp_name: update this to your dev Function App name.
# 3. stg_functionApp_name: update this to your stg Function App name.
# 4. prd_functionApp_name: update this to your prd Function App name.
# 5. pool_name: use the appropriate agent pool for the new project.
# 6. sc_dev: update this to your dev service connection.
# 7. sc_stg: update this to your stg service connection.
# 8. sc_prd: update this to your prd service connection.

# In the parameters section, update the node_version values if your function app uses a different Node.js version.
# --------------------------------------------------------------------------------------------------------------------

trigger: none # DO NOT CHANGE

# Variables that you need to change as per your project
variables:
  # Folder where the Function App files are stored
  source_folder: '$(System.DefaultWorkingDirectory)/application/lake-cac-npd-func-devcurrency01'

  # Function App name variable map based on environment
  dev_functionApp_name: 'lake-cac-npd-func-devcurrency02'
  stg_functionApp_name: 'lake-cac-prd-func-stgcurrency02'
  prd_functionApp_name: 'lake-cac-prd-func-prdcurrency02'

  # Name of pool you want to use
  pool_name: 'dops-prdagntpl01' 

  # Service connection variable map based on environment
  sc_dev: lake-dscn-bocqa01
  sc_stg: lake-dscn-stgbocad01
  sc_prd: lake-dscn-prdbocad01

# Input parameter for selecting environment
parameters:
  - name: environment
    displayName: Target Environment
    type: string
    default: dev
    values:
      - dev
      - stg
      - prd

  # Change or add the node_version values, if required
  - name: node_version
    displayName: Node.js Version
    type: string
    default: '18.16.0'
    values:
      - '18.16.0'

resources:
  repositories:
    - repository: lake-devops                     # Reference shared DevOps repo
      type: git
      name: lake-devops/lake-devops
      ref: refs/heads/main

# Reuse the shared functionapp-deploy-template from lake-devops
stages:
  - template: pipelines/function_app/functionapp-js-deploy-template.yaml@lake-devops
    parameters:
      environment: ${{ parameters.environment }} # Extract environment (dev/stg/prd) from parameter
      functionApp_name: ${{ variables[format('{0}_functionApp_name', parameters.environment)] }} # Extract the Function App name from the variable created above
      source_folder: ${{ variables.source_folder }} # Referencing the source_folder variable created above
      node_version: ${{ parameters.node_version }} # Extract Node.js version from parameter
      pool_name: ${{ variables.pool_name }} # Get the pool_name from the variable created above
      service_connection: ${{ variables[format('sc_{0}', parameters.environment)] }} # Dynamically extract prefix (dev/stg/prd) from environment parameter to lookup service connection
